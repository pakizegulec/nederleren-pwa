<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NederLeren PWA</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #f4f4f9; color: #333; }
    .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 350px; width: 90%; }
    h1 { font-size: 2.2rem; margin-bottom: 10px; color: #1a1a1a; }
    p { font-size: 1.2rem; color: #666; margin-bottom: 25px; }
    button { background-color: #007aff; color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
    button:active { background-color: #0056b3; }
  </style>
<script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE"></script></head>
<body>
  <div class="card">
    <h1 id="dutch-word">Goedemorgen</h1>
    <p id="translation">Günaydın</p>
    <button onclick="playDutchAudio()">Listen 🔊</button>
  </div>

  <script>
    function playDutchAudio() {
      const text = document.getElementById('dutch-word').innerText;
      const encodedText = encodeURIComponent(text);
      const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=nl&client=tw-ob`;
      
      const audio = new Audio(audioUrl);
      audio.play().catch(err => {
        console.log("Audio play failed, falling back:", err);
        // Fallback to WebSpeech if stream is blocked
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'nl-NL';
          window.speechSynthesis.speak(utterance);
        }
      });
    }
  </script>
</body>
</html>
