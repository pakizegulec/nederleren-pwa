          fallbackSpeechSynthesis(cleanDutch);
        });
      }
    }

      const voices = window.speechSynthesis.getVoices();

      const cardBox = document.getElementById('card-box');
      if (rating === 'again') { cardBox.classList.add('fly-top-left'); }
      else if (rating === 'good') { cardBox.classList.add('fly-top-right'); }
      else if (rating === 'hard') { cardBox.classList.add('fly-straight-down'); }

      setTimeout(() => {
        currentIndex = (currentIndex + 1) % activeCards.length;
        updateCard();
      }, 250);
    }

    updateUIStrings();
    updateChapterOptions();
    changeChapter();
  </script>
</body>
</html>
