<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NederLeren PWA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card-container {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .dutch-text {
      font-size: 2.4rem;
      font-weight: 700;
      color: #1c1e21;
      margin-bottom: 12px;
      line-height: 1.2;
      word-break: break-word;
    }
    .translation-text {
      font-size: 1.25rem;
      font-weight: 400;
      color: #606770;
      margin-bottom: 32px;
      min-height: 30px;
    }
    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }
    .btn {
      flex: 1;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-listen {
      background-color: #007aff;
      color: #ffffff;
    }
    .btn-next {
      background-color: #34c759;
      color: #ffffff;
    }
    .counter-badge {
      margin-top: 24px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #8a8d91;
      background: #f7f8fa;
      padding: 6px 14px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="dutch-text" id="dutch-word">Laden...</div>
    <div class="translation-text" id="translation">Yükleniyor...</div>
    <div class="controls">
      <button class="btn btn-listen" onclick="playAudio()">Listen 🔊</button>
      <button class="btn btn-next" onclick="nextCard()">Next ➡️</button>
    </div>
    <div class="counter-badge" id="counter">0 / 0</div>
  </div>

  <script>
    let words = [];
    let currentIndex = 0;
    let currentAudio = null;

    async function loadCSV() {
      try {
        const response = await fetch('words.csv?v=' + Date.now());
        const data = await response.text();
        const lines = data.split(/\r?\n/);
        
        words = [];
        lines.forEach(line => {
          if (!line.trim()) return;
          const parts = line.includes(';') ? line.split(';') : line.split(',');
          if (parts.length >= 1) {
            const nlVal = parts[0] ? parts[0].trim().replace(/^"|"$/g, '') : '';
            const trVal = parts[1] ? parts[1].trim().replace(/^"|"$/g, '') : '';
            if (nlVal) {
              words.push({ nl: nlVal, tr: trVal });
            }
          }
        });

        if (words.length > 0) {
          showCard(0);
        } else {
          document.getElementById('dutch-word').innerText = "Veri bulunamadı";
        }
      } catch (e) {
        document.getElementById('dutch-word').innerText = "CSV Yüklenemedi";
      }
    }

    function showCard(index) {
      if (words.length === 0) return;
      currentIndex = index;
      document.getElementById('dutch-word').innerText = words[currentIndex].nl;
      document.getElementById('translation').innerText = words[currentIndex].tr || '-';
      document.getElementById('counter').innerText = `${currentIndex + 1} / ${words.length}`;
    }

    function nextCard() {
      let next = Math.floor(Math.random() * words.length);
      showCard(next);
    }

    function playAudio() {
      const text = words[currentIndex] ? words[currentIndex].nl : '';
      if (!text || text === 'Laden...') return;

      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }

      // iOS Safari uyumlu doğrudan MP3 Akışı
      const cleanText = encodeURIComponent(text);
      const audioUrl = `https://api.streamelements.com/kappa/v2/speech?voice=Lotte&text=${cleanText}`;

      currentAudio = new Audio(audioUrl);
      currentAudio.play().catch(err => {
        console.error("Audio playback error:", err);
        // Fallback to VoiceText Engine
        const fallbackUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${cleanText}&tl=nl&client=tw-ob`;
        currentAudio = new Audio(fallbackUrl);
        currentAudio.play();
      });
    }

    window.onload = loadCSV;
  </script>
</body>
</html>
